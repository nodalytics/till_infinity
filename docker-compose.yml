# One node.
#
#   docker compose up -d                     the node, unarmed
#   TRADING_LIVE=1 docker compose up -d      the node, able to place orders
#
# Config from .env; see .env.example.
#
# **One process, not a service per part.** `statespace`, the journal and
# notifications are `Actor`s and the desks are `Strategy`s, sharing one kernel,
# bus, cache and portfolio. That sharing is what makes exposure answerable
# across venues: what is at risk is a question about an *account*, and a
# process per service would hide each one's positions from the others.
#
# **Redis is gone, and not by omission.** Nothing under `till_infinity/` imports
# it; Nautilus's bus is in-process. A bus nothing publishes to can only fail.
#
# The MT5 terminal stays a separate container because it is a Windows program
# under Wine. `TRADING_MT5_URL` points at its bridge, or the node starts one
# through `MT5ExecClientConfig(dockerized_terminal=...)`. See
# `adapters/mt5/terminal.py`.

services:
  node:
    build: .
    image: till-infinity:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: UTC
      # On the volume, so the healthcheck can tell "not yet up" from "up two
      # minutes ago and now gone".
      TILL_STATUS_PATH: /app/.data/status.json
    volumes:
      # The journal, the status file and any online model state. Mount it or
      # the record starts empty on every deploy.
      - data:/app/.data
    # **Nothing arms this but `TRADING_LIVE`.** Unset, the node still connects,
    # reconciles, subscribes and computes - those are reads, and they are how
    # the desk is observed - but its risk engine sits in `HALTED` and every
    # order is denied below the strategies and above the client. There is no
    # `profiles:` guard: a profile is a thing somebody forgets to pass, and
    # `HALTED` is a thing the venue never sees past. See `node/live._arm`.

volumes:
  data:
