# One node.
#
#   docker compose up -d                     the node, unarmed
#   TRADING_LIVE=1 docker compose up -d      the node, able to place orders
#
# Config from .env; see .env.example.
#
# **One process, not a service per part.** `statespace`, the journal and
# notifications are `Actor`s and the desks are `Strategy`s, sharing one kernel,
# bus, cache and portfolio. That sharing is what makes exposure answerable
# across venues: what is at risk is a question about an *account*, and a
# process per service would hide each one's positions from the others.
#
# **Redis is back, for the cache and not for the bus.** It was removed because
# nothing published to it - Nautilus's message bus is in-process and a bus with
# no publisher can only fail - and that argument still holds: `till_infinity/`
# imports no redis client and the bus stays in-process.
#
# The *cache* is a different consumer. It holds the orders and positions this
# process knows about, in memory, so a restart forgets them while the broker
# does not. On 2026-11-21 a position opened at 10:35, the container restarted at
# 11:24, the engine re-discovered the position by reconciliation and attached it
# to a synthetic order - so when its stop fired at 11:32 the closing fill
# matched nothing and the position became a phantom. `RedisCacheDatabase` is
# compiled into the Nautilus extension, so this is a service and not a
# dependency.
#
# **The node does not use it unless `TRADING_CACHE_REDIS` is set**, so a compose
# up with that unset runs exactly as before and this service is idle.
#
# The MT5 terminal stays a separate container because it is a Windows program
# under Wine. `TRADING_MT5_URL` points at its bridge, or the node starts one
# through `MT5ExecClientConfig(dockerized_terminal=...)`. See
# `adapters/mt5/terminal.py`.

services:
  node:
    build: .
    image: till-infinity:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: UTC
      # On the volume, so the healthcheck can tell "not yet up" from "up two
      # minutes ago and now gone".
      TILL_STATUS_PATH: /app/.data/status.json
    volumes:
      # The journal, the status file and any online model state. Mount it or
      # the record starts empty on every deploy.
      - data:/app/.data
    # **Nothing arms this but `TRADING_LIVE`.** Unset, the node still connects,
    # reconciles, subscribes and computes - those are reads, and they are how
    # the desk is observed - but its risk engine sits in `HALTED` and every
    # order is denied below the strategies and above the client. There is no
    # `profiles:` guard: a profile is a thing somebody forgets to pass, and
    # `HALTED` is a thing the venue never sees past. See `node/live._arm`.

  # **Named `cache` because that is all it is.** Not a bus, not a queue, and
  # not a database the desk reads for anything it could not reconstruct from
  # the broker. If it is empty the node starts as it always did.
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    # **Persistence on, or this buys nothing.** `appendonly` fsyncs the log so
    # a Redis restart does not lose what a node restart was supposed to find.
    # `--save ""` turns the RDB snapshots off: two persistence mechanisms on one
    # small keyspace is one more thing to go wrong, and the AOF is the one that
    # survives an unclean stop.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    # Small on purpose. The keyspace is this desk's open orders and positions -
    # kilobytes - and a cache allowed to grow into the node's memory would
    # trade one outage for another on a 2-core box with 3.8GB.
    mem_limit: 128m
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  data:
  cache:
