# One process per service over Redis, so they fail independently.
# `till-infinity run` is the single-process shape - see docs/deployment.md.
#
#   docker compose up -d                     all but agents and trading
#   docker compose --profile trading up -d   adds the one that can lose money
#
# Config from .env; see .env.example.

x-common: &common
  build: .
  image: till-infinity:latest
  restart: unless-stopped
  env_file: [.env]
  environment:
    TILL_REDIS_URL: redis://redis:6379
    TZ: UTC
  volumes:
    - data:/app/.data
  depends_on:
    redis:
      condition: service_healthy

services:
  # The bus. Everything talks through it, so it is the one hard dependency.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The settings live in `services/redis/redis.conf`, where each one can
    # carry the reason it is not the default. `--appendonly yes` on the command
    # line was the only one, and it is now the first line of that file.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis:/data
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── collectors ────────────────────────────────────────────────────────────
  prices:
    <<: *common
    command: ["prices", "collect", "--publish", "redis://redis:6379"]

  news:
    <<: *common
    command: ["news", "collect", "--publish", "redis://redis:6379"]

  # ── the numeric layer: no credentials, always on ──────────────────────────
  # `structures` stood here until 2026-10-29 and is retired. This file had been
  # left describing the old topology: a desk started from it ran no statespace
  # at all, so nothing proposed and trading had nothing to decide on.
  statespace:
    <<: *common
    command: ["statespace", "watch", "--redis", "redis://redis:6379"]

  # ── the record: one writer, which is why it is on the bus ─────────────────
  journal:
    <<: *common
    command: ["journal", "listen", "--redis", "redis://redis:6379"]

  # ── delivery: exits quietly with no channel configured ────────────────────
  notifications:
    <<: *common
    command: ["notify", "listen", "--redis", "redis://redis:6379"]

  # ── execution: the only part that can *lose* money, so opt in twice ───────
  # The profile starts it; TRADING_LIVE arms it. No terminal in this container
  # (Windows-only) - TRADING_MT5_URL must point at a bridge, or it stays paper.
  trading:
    <<: *common
    profiles: ["trading"]
    command: ["trading", "run", "--redis", "redis://redis:6379"]

volumes:
  data:
  redis:
