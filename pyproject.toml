[project]
name = "till-infinity"
version = "0.1.0"
description = "Prices the market against a fair-value estimate from where volatility turns, and takes a stance on the distance"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel Ojietohamen", email = "seekersoftec@gmail.com" }
]
dependencies = [
    "anthropic>=0.121.0",
    "click>=8.4.2",
    "httpx>=0.28.1",
    "httpx-ws>=0.9.0",
    "orjson>=3.11.9",
    "pydantic-ai-slim[anthropic,groq]>=2.28.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ccxt>=4.4.0",
    "msgpack>=1.1.0",
    "river[pandas]>=0.25.0",
    "tenacity>=9.1.4",
    "yfinance>=1.5.2",
    # The logger, environment parsing, `Restorable`, the persistence codec and
    # the bus-contract reader. A workspace member rather than a `shared/`
    # directory inside this package, because a service cannot carry its own
    # dependency manifest while importing the desk - see
    # `packages/till-platform/README.md`.
    "till-platform",
    # The transport `bus.py` is built on. Its own package rather than part of
    # till-platform because it carries a dependency the platform does not:
    # `redis`, which would otherwise land in the manifest of every service
    # that only ever logs. See `packages/till-channels/README.md`.
    "till-channels",
    # **A dependency, not an inlined package.** `services/statespace` has its
    # own manifest and installs without the desk - that is what makes it
    # separable. The desk depends on it so `stack.py` can still run it in the
    # one process, which ADR 0002 keeps as the default until a service earns
    # its own: the layout is a source-tree decision, not a deployment one.
    "statespace",
]

[project.optional-dependencies]
speed = ["uvloop>=0.21.0; sys_platform != 'win32'"]
# Agents run on Claude out of the box. These add the clients for other
# providers - `openai` also covers xAI's Grok, DeepSeek and OpenRouter, which
# all speak the OpenAI wire format.
openai = ["pydantic-ai-slim[openai]>=2.28.0"]
google = ["pydantic-ai-slim[google]>=2.28.0"]
groq = ["pydantic-ai-slim[groq]>=2.28.0"]
redis = ["redis>=5.0.0"]
# The native MT5 binding. Marked win32 because it is not a package that has
# merely been neglected on other platforms - it is an in-process call into a
# running Windows terminal, with no Linux wheel to build against. The marker
# keeps `uv sync --all-extras` working in CI, where it resolves to nothing and
# the bridge backend is used instead.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
# Talking to a Windows terminal from anywhere, by proxying the module itself
# out of a Wine prefix. No platform marker: this half runs on the Linux side.
rpyc = ["rpyc>=6.0.0"]
# Chart images on alert cards. Optional: without it the cards go out as
# text, and the service says so once.
chart = ["matplotlib>=3.8"]
# Retraining the offline models. The pipeline itself is retired - see
# `research/retire/models/` - so this is kept for anyone reviving it from
# there, and nothing in the live package imports it.
train = ["scikit-learn>=1.5.0"]
# Reading the tick corpus `services/ticks` writes, and validating the bus
# schemas it is contracted by.
#
# **Both were already installed transitively and neither was declared**, which
# is how `pandas.read_parquet` failed on the first attempt to read a corpus
# this repository produced: a dependency that happens to be present is not one
# the project has.
contracts = ["jsonschema>=4.20.0"]
corpus = ["pyarrow>=16.0.0"]

[project.scripts]
till-infinity = "till_infinity.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

# **The workspace.** Each member builds and installs on its own; the desk and
# the services depend on the packages rather than reaching into each other.
#
# `services/*` is a glob so a new Python service needs no edit here. Anything
# that is **not** a Python distribution does need a line: uv refuses a member
# with no `pyproject.toml` rather than skipping it, so each one is excluded by
# name. `services/ticks` is Go; `services/redis` is a broker's config with no
# code at all, which ADR 0002 puts under `services/` because `services/` is for
# things that run.
#
# That is the cost of one directory holding more than one kind of thing, and it
# is a line in a config file against a boundary that is otherwise invisible.
# `test_the_go_service_is_excluded_rather_than_broken` is what makes a missing
# line fail here rather than at the next `uv sync`.
[tool.uv.workspace]
members = ["packages/*", "services/*"]
exclude = ["services/ticks", "services/redis"]

[tool.uv.sources]
till-platform = { workspace = true }
till-channels = { workspace = true }
statespace = { workspace = true }

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Experiments, not library code. They are written to be read alongside their
# results and thrown away once the question is answered, so the repo's style
# rules would cost more than they return here.
extend-exclude = ["research", "assets"]

[tool.ruff.lint]
# Ruff covers pylint (the PL rules) alongside everything else, so there is one
# linter, one config and one pass rather than two overlapping tools.
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # pyupgrade
    "ASYNC",   # async correctness
    "B",       # bugbear
    "A",       # shadowed builtins
    "C4",      # comprehensions
    "PIE",
    "PT",      # pytest style
    "RET",
    "SIM",
    "ARG",     # unused arguments
    "PL",      # pylint
    "PERF",
    "RUF",
]
ignore = [
    "PLC0415",  # lazy imports are deliberate - yfinance drags in pandas
    "PLR0913",  # a click command takes one parameter per CLI option
    "PLR0917",
    "PLR2004",  # comparing against a literal is usually clearer than naming it
    "ASYNC109", # we wrap httpx-ws, whose read API takes a timeout argument
]

[tool.ruff.lint.pylint]
# The socket read loops branch on the protocol, not on tangled logic.
max-branches = 15
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # fakes accept arguments they have no reason to use
# channels/ is a general-purpose transport library with its own naming. These
# exemptions are for deliberate API choices, not defects: renaming ChannelFull
# to ChannelFullError would break every caller to satisfy a convention, and the
# `timed` decorator is lowercase because decorators read as verbs.
"packages/till-channels/till_channels/*" = [
    "N818",    # ChannelClosed / ChannelFull / ChannelEmpty are the public names
    "N801",    # `timed` is a decorator, not a class you instantiate
    "ARG002",  # backoff strategies share a signature; some ignore `attempt`
    "PLW0603", # a module-level metrics default is set once, on purpose
]
"tests/channels/*" = ["PT011", "RUF012", "PERF401"]
# trading/ is a set of ports with several implementations behind each, so the
# exemptions here are about interfaces rather than about code that got away.
# See docs/deployment.md.
"till_infinity/trading/venues/broker.py" = ["ARG002", "B027"]
"till_infinity/trading/strategies/strategy.py" = ["B027"]
"till_infinity/trading/venues/paper.py" = ["ARG002"]
# `codec.unpack` is one return per wire type. Collapsing eight tagged
# shapes into a table would put the mapping somewhere other than beside
# the code that reads it, for no gain but a lint score.
"till_infinity/structures/codec.py" = ["PLR0911"]
# `Parse.kind` is a dispatch table written as code: one return per event kind,
# beside the cached parse step it reads.
# `Guard.allows` is the same shape: one return per gate, each naming itself.
"till_infinity/trading/risk.py" = ["PLR0911"]
# `Tracker.update` advances one touch through its states - first contact, wick,
# origin, break, trap window, resolution - and the branch count is one per
# transition. Splitting it would put half a state machine in another method and
# make the order the transitions happen in harder to read, not easier.
"till_infinity/structures/reactions.py" = ["PLR0912"]
# `import MetaTrader5 as mt5` is the name every MT5 example and the terminal's
# own documentation uses; renaming it would make this file harder to check
# against them.
"till_infinity/trading/venues/mt5_native.py" = ["N813"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
