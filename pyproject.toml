[project]
name = "till-infinity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel Ojietohamen", email = "seekersoftec@gmail.com" }
]
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "httpx-ws>=0.9.0",
    "orjson>=3.11.9",
    "rich>=15.0.0",
    "river[pandas]>=0.25.0",
    "tenacity>=9.1.4",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
speed = ["uvloop>=0.21.0; sys_platform != 'win32'"]

[project.scripts]
till-infinity = "till_infinity.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff covers pylint (the PL rules) alongside everything else, so there is one
# linter, one config and one pass rather than two overlapping tools.
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # pyupgrade
    "ASYNC",   # async correctness
    "B",       # bugbear
    "A",       # shadowed builtins
    "C4",      # comprehensions
    "PIE",
    "PT",      # pytest style
    "RET",
    "SIM",
    "ARG",     # unused arguments
    "PL",      # pylint
    "PERF",
    "RUF",
]
ignore = [
    "PLC0415",  # lazy imports are deliberate — yfinance drags in pandas
    "PLR0913",  # a click command takes one parameter per CLI option
    "PLR0917",
    "PLR2004",  # comparing against a literal is usually clearer than naming it
    "ASYNC109", # we wrap httpx-ws, whose read API takes a timeout argument
]

[tool.ruff.lint.pylint]
# The socket read loops branch on the protocol, not on tangled logic.
max-branches = 15
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # fakes accept arguments they have no reason to use

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
