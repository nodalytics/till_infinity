[project]
name = "till-infinity"
version = "0.1.0"
description = "Finding high-probability directional structures in price, backed by fundamentals"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel Ojietohamen", email = "seekersoftec@gmail.com" }
]
dependencies = [
    "anthropic>=0.121.0",
    "click>=8.4.2",
    "httpx>=0.28.1",
    "httpx-ws>=0.9.0",
    "orjson>=3.11.9",
    "pydantic-ai-slim[anthropic]>=2.28.0",
    "rich>=15.0.0",
    "river[pandas]>=0.25.0",
    "tenacity>=9.1.4",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
speed = ["uvloop>=0.21.0; sys_platform != 'win32'"]
# Agents run on Claude out of the box. These add the clients for other
# providers — `openai` also covers xAI's Grok, DeepSeek and OpenRouter, which
# all speak the OpenAI wire format.
openai = ["pydantic-ai-slim[openai]>=2.28.0"]
google = ["pydantic-ai-slim[google]>=2.28.0"]
groq = ["pydantic-ai-slim[groq]>=2.28.0"]
redis = ["redis>=5.0.0"]

[project.scripts]
till-infinity = "till_infinity.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff covers pylint (the PL rules) alongside everything else, so there is one
# linter, one config and one pass rather than two overlapping tools.
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # pyupgrade
    "ASYNC",   # async correctness
    "B",       # bugbear
    "A",       # shadowed builtins
    "C4",      # comprehensions
    "PIE",
    "PT",      # pytest style
    "RET",
    "SIM",
    "ARG",     # unused arguments
    "PL",      # pylint
    "PERF",
    "RUF",
]
ignore = [
    "PLC0415",  # lazy imports are deliberate — yfinance drags in pandas
    "PLR0913",  # a click command takes one parameter per CLI option
    "PLR0917",
    "PLR2004",  # comparing against a literal is usually clearer than naming it
    "ASYNC109", # we wrap httpx-ws, whose read API takes a timeout argument
]

[tool.ruff.lint.pylint]
# The socket read loops branch on the protocol, not on tangled logic.
max-branches = 15
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # fakes accept arguments they have no reason to use
# channels/ is a general-purpose transport library with its own naming. These
# exemptions are for deliberate API choices, not defects: renaming ChannelFull
# to ChannelFullError would break every caller to satisfy a convention, and the
# `timed` decorator is lowercase because decorators read as verbs.
"till_infinity/channels/*" = [
    "N818",    # ChannelClosed / ChannelFull / ChannelEmpty are the public names
    "N801",    # `timed` is a decorator, not a class you instantiate
    "ARG002",  # backoff strategies share a signature; some ignore `attempt`
    "PLW0603", # a module-level metrics default is set once, on purpose
]
"tests/channels/*" = ["PT011", "RUF012", "PERF401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
