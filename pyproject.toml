[project]
name = "till-infinity"
version = "0.1.0"
description = "Prices the market against a fair-value estimate from where volatility turns, and takes a stance on the distance"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel Ojietohamen", email = "seekersoftec@gmail.com" }
]
dependencies = [
    "anthropic>=0.121.0",
    "click>=8.4.2",
    "httpx>=0.28.1",
    "httpx-ws>=0.9.0",
    "orjson>=3.11.9",
    "pydantic-ai-slim[anthropic]>=2.28.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ccxt>=4.4.0",
    "river[pandas]>=0.25.0",
    "tenacity>=9.1.4",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
speed = ["uvloop>=0.21.0; sys_platform != 'win32'"]
# Agents run on Claude out of the box. These add the clients for other
# providers - `openai` also covers xAI's Grok, DeepSeek and OpenRouter, which
# all speak the OpenAI wire format.
openai = ["pydantic-ai-slim[openai]>=2.28.0"]
google = ["pydantic-ai-slim[google]>=2.28.0"]
groq = ["pydantic-ai-slim[groq]>=2.28.0"]
redis = ["redis>=5.0.0"]
# The native MT5 binding. Marked win32 because it is not a package that has
# merely been neglected on other platforms - it is an in-process call into a
# running Windows terminal, and there is no Linux wheel to build against. The
# marker keeps `uv sync --all-extras` working in CI on Linux, where this
# resolves to nothing and the bridge backend is used instead.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
# Talking to a Windows terminal from anywhere, by proxying the module itself
# out of a Wine prefix. No platform marker: this half runs on the Linux side.
rpyc = ["rpyc>=6.0.0"]

[project.scripts]
till-infinity = "till_infinity.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Experiments, not library code. They are written to be read alongside their
# results and thrown away when the question is answered, so the repo's style
# gates should not block CI on them - and a lint failure there would stop a
# deploy over a scratch script.
#
# `assets` is the same category: a generator run by hand to produce the logo
# SVGs, judged by looking at what comes out. It is not imported by anything.
# The exclusion was added after it did exactly what the paragraph above warns
# about - an unsorted import block in a logo script failed CI and blocked a
# deploy of the trading service.
extend-exclude = ["research/harness", "assets"]

[tool.ruff.lint]
# Ruff covers pylint (the PL rules) alongside everything else, so there is one
# linter, one config and one pass rather than two overlapping tools.
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # pyupgrade
    "ASYNC",   # async correctness
    "B",       # bugbear
    "A",       # shadowed builtins
    "C4",      # comprehensions
    "PIE",
    "PT",      # pytest style
    "RET",
    "SIM",
    "ARG",     # unused arguments
    "PL",      # pylint
    "PERF",
    "RUF",
]
ignore = [
    "PLC0415",  # lazy imports are deliberate - yfinance drags in pandas
    "PLR0913",  # a click command takes one parameter per CLI option
    "PLR0917",
    "PLR2004",  # comparing against a literal is usually clearer than naming it
    "ASYNC109", # we wrap httpx-ws, whose read API takes a timeout argument
]

[tool.ruff.lint.pylint]
# The socket read loops branch on the protocol, not on tangled logic.
max-branches = 15
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # fakes accept arguments they have no reason to use
# channels/ is a general-purpose transport library with its own naming. These
# exemptions are for deliberate API choices, not defects: renaming ChannelFull
# to ChannelFullError would break every caller to satisfy a convention, and the
# `timed` decorator is lowercase because decorators read as verbs.
"till_infinity/channels/*" = [
    "N818",    # ChannelClosed / ChannelFull / ChannelEmpty are the public names
    "N801",    # `timed` is a decorator, not a class you instantiate
    "ARG002",  # backoff strategies share a signature; some ignore `attempt`
    "PLW0603", # a module-level metrics default is set once, on purpose
]
"tests/channels/*" = ["PT011", "RUF012", "PERF401"]
# trading/ is a set of ports with several implementations behind each, so the
# exemptions here are about interfaces rather than about code that got away.
# A hook an implementation may leave alone still has to declare the arguments
# its overrides receive, and `Broker.close` doing nothing is the correct
# behaviour for a backend holding no connection - not an unfinished method.
"till_infinity/trading/broker.py" = ["ARG002", "B027"]
"till_infinity/trading/strategy.py" = ["B027"]
"till_infinity/trading/paper.py" = ["ARG002"]
# The gate chain in `LevelStrategy.consider` is one return per refusal, which
# is the design: each gate names itself and stops. Collapsing fifteen reasons
# into fewer exits would trade a readable refusal for a lint score. The branch
# count is the same fact counted differently - two of the checks have already
# been extracted to methods on their own merits, and further extraction would
# be done to satisfy the counter rather than to make anything clearer.
"till_infinity/trading/scalper.py" = ["ARG002", "PLR0911", "PLR0912"]
# The swing strategies moved out of scalper.py and brought its exemptions:
# `FadeToValue.consider` overrides the whole chain and returns a refusal at
# each stage, which is the shape, not a smell.
"till_infinity/trading/swing.py" = ["ARG002", "PLR0911", "PLR0912"]
# Same shape again: one return per refusal, each naming its own gate. And the
# synchronous `consider` exists only to refuse - the council is async, so it
# takes the port's arguments and uses none of them.
"till_infinity/trading/council.py" = ["ARG002", "PLR0911"]
# `Guard.allows` is the same shape: one return per gate, each naming itself.
"till_infinity/trading/risk.py" = ["PLR0911"]
# `Tracker.update` advances one touch through its states - first contact, wick,
# origin, break, trap window, resolution - and the branch count is one per
# transition. Splitting it would put half a state machine in another method and
# make the order the transitions happen in harder to read, not easier, which is
# the opposite of what the rule is for.
"till_infinity/structures/reactions.py" = ["PLR0912"]
# `import MetaTrader5 as mt5` is the name every MT5 example and the terminal's
# own documentation uses; renaming it would make this file harder to check
# against them.
"till_infinity/trading/mt5_native.py" = ["N813"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
