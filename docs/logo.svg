<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 14 230 128" width="230" height="128"
     role="img" aria-label="Till Infinity">
  <title>Till Infinity</title>
  <desc>A price line that traces an infinity loop, then breaks out to a new high.</desc>

  <defs>
    <linearGradient id="ti-sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2AA79B"/>
      <stop offset="1" stop-color="#E0A63C"/>
    </linearGradient>
  </defs>

  <!-- One unbroken stroke: around the figure-eight, then up and out.
       The loop is the infinity, the tail is the chart. -->
  <path d="M 198,86
           C 198,44 152,44 122,86
           C 92,128 46,128 46,86
           C 46,44 92,44 122,86
           C 152,128 198,128 198,86
           L 222,60 L 248,30"
        fill="none" stroke="url(#ti-sweep)" stroke-width="12"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- The last print. -->
  <circle cx="248" cy="30" r="8.5" fill="#E0A63C"/>
</svg>
