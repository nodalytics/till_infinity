[project]
name = "till-channels"
version = "0.1.0"
description = "The transport the bus runs on: typed send/receive channels, in memory or over Redis, with an outbox for durability."
requires-python = ">=3.11"
# **Nothing required.** The in-memory channel is asyncio and the outbox is
# sqlite3, both stdlib. `redis` is imported inside the functions that need it,
# so a service that never names a Redis URL never needs the extra.
dependencies = []

# **No extras.** The Redis backend's three imports are all inside the
# functions that use them, so `redis.py` still imports and still works wherever
# a `redis` client happens to be installed - it is simply no longer something
# this package asks for. Nautilus supplies the message bus from 2026-10-31, and
# its Redis backing is its own concern.

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
