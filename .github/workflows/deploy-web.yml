name: Deploy dashboard

# **A separate pipeline, so a dashboard change never restarts the desk.**
#
# `deploy.yml` excludes `web/**`; this is the other half. It builds a different
# image, deploys a different container, and the two trigger on disjoint paths,
# so no commit can fire both. The trading node does not contain this and never
# imports it, so the thing holding positions has no reason to be restarted for
# a stylesheet - the cost of getting that wrong is in `deploy.yml`'s own note:
# four deploys in an afternoon, each one a backfill, one of them for a
# docs-only commit.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/deploy-web.sh"
      - ".github/workflows/deploy-web.yml"
      # The API imports these, so a change to either can break the dashboard
      # without touching `web/`. It cannot break the desk: this workflow only
      # ever replaces `till-web`.
      - "till_infinity/strategies/report.py"
      - "till_infinity/journal/**"
  workflow_dispatch:

# Its own group. Sharing the desk's would make a dashboard build block a
# trading deploy behind it, which is the wrong way round.
concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  # The same suite the desk's pipeline runs. The dashboard imports
  # `strategies.report` and `journal` directly, so a green suite is the thing
  # that says those still mean what the panels claim.
  test:
    uses: ./.github/workflows/ci.yml

  # **Both architectures, on native runners.** This built amd64 only, on the
  # reasoning that the dashboard targets one host - and that host is Graviton,
  # so `docker pull` failed with exactly the error `deploy.yml` predicts three
  # lines above its own matrix: "no matching manifest for linux/arm64/v8 - a
  # clear message arriving at the least convenient moment". The comment was
  # there to be read and was read as past tense.
  #
  # Native runners rather than QEMU: this image compiles a Next app and
  # installs nautilus and pandas, and emulating that is minutes against hours.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **Pushed by digest, tagged by the merge below.** Two jobs cannot both
      # write the same tag without one winning and the other's architecture
      # disappearing - which would look exactly like a fix and leave the
      # original bug. `deploy.yml` solved this already and this is its pattern,
      # not a second one.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per architecture, or the two jobs share a scope and each evicts the
          # other's layers.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The filename is the digest with `sha256:` stripped: `upload-artifact@v4`
      # rejects a colon in a path, and the merge re-adds the prefix itself.
      - name: Hand the digest to the merge
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
          echo "built ${{ matrix.platform }} as ${digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # One manifest list over both digests, so `docker pull` resolves correctly on
  # either architecture and the tag means the same thing everywhere.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" -t "${IMAGE}:${TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | head -c 400; echo

  deploy:
    needs: manifest
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Images only, and never `container prune`: a stopped container on that
      # box may be the desk's own `till-infinity-prev`, which is its rollback.
      - name: Reclaim disk
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$HOST" '
            docker image prune -af >/dev/null 2>&1 || true
            df -h / | awk "NR==2 {print \$4 \" free of \" \$2 \" (\" \$5 \" used)\"}"
          '

      # Every interpolation goes through `env:` rather than into the command
      # string. Neither `github.sha` nor the image name is attacker-controlled,
      # but a workflow that interpolates straight into a shell is the habit
      # that eventually meets one that is.
      - name: Deploy the dashboard
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/deploy.pem scripts/deploy-web.sh "$HOST:/tmp/till-deploy-web.sh"
          ssh -i ~/.ssh/deploy.pem "$HOST" \
            "IMAGE='$IMAGE' TAG='$TAG' bash /tmp/till-deploy-web.sh"

      # **The point of the whole file.** If a dashboard deploy ever restarts the
      # desk, this is where it shows, and it fails the run rather than being
      # noticed days later in a gap in the equity curve.
      - name: Prove the desk was not touched
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$HOST" '
            set -e
            started="$(docker inspect -f "{{.State.StartedAt}}" till-infinity 2>/dev/null || echo missing)"
            restarts="$(docker inspect -f "{{.RestartCount}}" till-infinity 2>/dev/null || echo 0)"
            health="$(docker inspect -f "{{.State.Health.Status}}" till-infinity 2>/dev/null || echo none)"
            echo "desk started $started, restarts $restarts, health $health"
            if [ "$health" != "healthy" ] && [ "$health" != "none" ]; then
              echo "the desk is not healthy after a dashboard deploy" >&2
              exit 1
            fi
            age=$(( $(date +%s) - $(date -d "$started" +%s) ))
            if [ "$age" -lt 120 ]; then
              echo "the desk restarted ${age}s ago - a dashboard deploy must not do that" >&2
              exit 1
            fi
          '
