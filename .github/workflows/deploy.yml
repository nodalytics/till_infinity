# Build here, run there.
#
# See docs/deployment.md.

name: Deploy

on:
  push:
    branches: [main]
    # Prose and experiments change nothing the instance runs, and every deploy
    # is a restart. On 2026-08-14 four deploys in an afternoon each cost a
    # backfill, one of them for a docs-only commit, and the level pipeline was
    # down for four hours across them. A push that cannot alter the image should
    # not restart the service.
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**/*.md"
      - "LICENSE"
      # The dashboard is a separate deployable that the trading image does not
      # contain and the live node never imports. Without this line every commit
      # to a stylesheet would rebuild the image and restart the desk, which is
      # the exact cost the note above is about.
      - "web/**"
      # **Its pipeline lives outside `web/`, and that gap cost a restart.** The
      # commit that added `deploy-web.yml` - whose whole subject was that
      # deploying the dashboard must not restart the desk - restarted the desk,
      # because its own two files are not under `web/`. Neither can alter the
      # trading image: one builds a different image, the other replaces a
      # different container.
      - "scripts/deploy-web.sh"
      - ".github/workflows/deploy-web.yml"
      # **Tests are not in the image.** The Dockerfile copies `till_infinity/`
      # and the project metadata and nothing else, so a change under `tests/`
      # cannot alter a byte of what the instance runs - and on 2026-11-14 a
      # dashboard-only commit restarted the live desk anyway, because the two
      # tests that came with it are the one path in that commit this list did
      # not cover. That is the third time this shape has been found here, and
      # the first two are the two notes above it.
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a half-finished deploy

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Deploying something the tests have not passed is how a broken main reaches
  # a box nobody is watching.
  test:
    uses: ./.github/workflows/ci.yml

  # Both architectures, because the instances are not all the same. An
  # amd64-only image fails at `docker pull` on Graviton with "no matching
  # manifest for linux/arm64/v8" - a clear message arriving at the least
  # convenient moment, after the old box has been stopped for the cutover.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and tagged later. Two jobs cannot both write the same
      # tag without one of them winning and the other's architecture
      # disappearing, which is the failure this pattern exists to avoid.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per architecture, or the two jobs share a cache scope and each
          # keeps evicting the other's layers.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The filename is the digest with `sha256:` stripped, for two reasons that
      # both bite: `upload-artifact@v4` rejects a colon in a path, and the merge
      # below re-adds the prefix itself, so leaving it here would produce
      # `sha256:sha256:…`.
      - name: Hand the digest to the merge
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
          echo "built ${{ matrix.platform }} as ${digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # One manifest list over both digests, so `docker pull` on either
  # architecture resolves to the right image and the tag means the same thing
  # everywhere.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit as well as `latest`, so a rollback is a tag change
      # rather than a rebuild of something that no longer exists.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" -t "${IMAGE}:${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
            | grep -E "Name|Platform"

  deploy:
    needs: manifest
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # `deploy.sh` prunes before it pulls, which is where the guarantee lives.
      # This step exists anyway, for two reasons worth the duplication: it runs
      # before a byte is transferred, so a full disk cannot fail the scp either;
      # and it holds when deploying a commit whose `deploy.sh` predates that fix,
      # which is exactly when the box is already full.
      - name: Reclaim disk on the instance
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$HOST" '
            docker container prune -f >/dev/null 2>&1 || true
            docker image prune -af  >/dev/null 2>&1 || true
            df -h / | awk "NR==2 {print \$4 \" free of \" \$2 \" (\" \$5 \" used)\"}"
          '

      - name: Deploy
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/deploy.pem scripts/deploy.sh "$HOST:/tmp/till-deploy.sh"
          ssh -i ~/.ssh/deploy.pem "$HOST" \
            "IMAGE='${{ env.IMAGE }}' TAG='${{ github.sha }}' bash /tmp/till-deploy.sh"

      - name: Prove it came back up
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          # **Longer than the image's `--start-period`.** A healthcheck reports
          # `starting` for the whole of that period whatever its probes say, so
          # a gate that gives up sooner only ever sees `starting` and learns
          # nothing. `test_the_deploy_waits_for_healthy_and_not_merely_running`
          # reads both numbers and fails if this one stops being the larger.
          HEALTH_WAIT_S: 420
        run: |
          sleep 20
          # Sent as a quoted heredoc so the remote script is the text written
          # here: the previous version nested three levels of quoting inside a
          # single `ssh` argument, which is why it was never extended.
          if ! ssh -i ~/.ssh/deploy.pem "$HOST" "HEALTH_WAIT_S=$HEALTH_WAIT_S bash -s" <<'REMOTE'
          set -u
          name=till-infinity

          # **`docker ps` prints `Up` for a container in restart backoff**, so
          # grepping for it passed over a desk that restarted 27 times on
          # 2026-11-03. `State.Status` and `State.Restarting` are what
          # distinguish them, and the restart count is compared across two
          # samples because a loop can be `running` at any single instant.
          read -r status restarting first <<<"$(docker inspect -f \
            '{{.State.Status}} {{.State.Restarting}} {{.RestartCount}}' "$name")"
          sleep 20
          later="$(docker inspect -f '{{.RestartCount}}' "$name")"
          echo "status=$status restarting=$restarting restarts=$first->$later"
          [ "$status" = "running" ] && [ "$restarting" = "false" ] \
            && [ "$later" -le "$first" ] || exit 1

          # **And then health, because `running` is not `healthy`.** On
          # 2026-11-06 the three checks above all passed while the node had
          # already written that it was stopping; it failed its healthcheck
          # fourteen times in a row and the deploy had long since gone green.
          # A process can start, give up, and leave the container alive around
          # it, and nothing above notices.
          if [ -z "$(docker inspect -f '{{if .State.Health}}yes{{end}}' "$name")" ]; then
            echo "no healthcheck on this image - liveness is all there is to check"
            exit 0
          fi
          deadline=$(( $(date +%s) + HEALTH_WAIT_S ))
          while :; do
            health="$(docker inspect -f '{{.State.Health.Status}}' "$name")"
            case "$health" in
              healthy) echo "healthy"; exit 0 ;;
              unhealthy) echo "unhealthy - the desk came up and stopped"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "still $health after ${HEALTH_WAIT_S}s - treating that as a failure"
              exit 1
            fi
            sleep 10
          done
          REMOTE
          then
            # The health log first: it carries the probe's own words, which is
            # what said "the node wrote that it was stopping".
            ssh -i ~/.ssh/deploy.pem "$HOST" \
              'docker inspect till-infinity --format "{{json .State.Health}}"; \
               docker logs --tail 40 till-infinity'
            exit 1
          fi
