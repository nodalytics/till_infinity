# Build here, run there.
#
# The instance does not build its own image: a `uv sync` of river and pandas is
# slow on two cores at best and was OOM-killed at worst on the 908MB box this
# started on. GitHub builds and publishes; the instance pulls.
#
# For **both** architectures, since they are not all the same - the box may be
# Graviton, and an amd64-only image fails at the pull rather than at the build.

name: Deploy

on:
  push:
    branches: [main]
    # Prose and experiments change nothing the instance runs, and every deploy
    # is a restart. On 2026-08-14 four deploys in an afternoon each cost a
    # backfill, and one of them was a docs-only commit; the level pipeline was
    # down for four hours across them. A push that cannot alter the image
    # should not restart the service.
    #
    # `paths-ignore` skips the run only when *every* changed file matches, so a
    # commit touching code and docs together still deploys.
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a half-finished deploy

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Deploying something the tests have not passed is how a broken main reaches
  # a box nobody is watching.
  test:
    uses: ./.github/workflows/ci.yml

  # Both architectures, because the instances are not all the same. An
  # amd64-only image fails at `docker pull` on Graviton with "no matching
  # manifest for linux/arm64/v8", which is a clear message arriving at the
  # least convenient moment - after the old box has been stopped for the
  # cutover.
  #
  # Native runners rather than QEMU. The repository is public, so
  # `ubuntu-24.04-arm` is free, and emulating an arm64 build of pandas and
  # river costs an order of magnitude more wall clock than running it on the
  # architecture it targets.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and tagged later. Two jobs cannot both write the same
      # tag without one of them winning and the other's architecture
      # disappearing, which is the failure this pattern exists to avoid.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per architecture, or the two jobs share a cache scope and each
          # keeps evicting the other's layers.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The filename is the digest with `sha256:` stripped, for two reasons that
      # both bite: `upload-artifact@v4` rejects a colon in a path, and the merge
      # below re-adds the prefix itself, so leaving it here would produce
      # `sha256:sha256:…`.
      - name: Hand the digest to the merge
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
          echo "built ${{ matrix.platform }} as ${digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # One manifest list over both digests, so `docker pull` on either
  # architecture resolves to the right image and the tag means the same thing
  # everywhere.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit as well as `latest`, so a rollback is a tag change
      # rather than a rebuild of something that no longer exists.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" -t "${IMAGE}:${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
            | grep -E "Name|Platform"

  deploy:
    needs: manifest
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # `deploy.sh` prunes before it pulls, which is where the guarantee lives.
      # This step exists anyway, for two reasons worth the duplication: it runs
      # before a single byte is transferred, so a full disk cannot fail the scp
      # either; and it holds even when deploying a commit whose `deploy.sh`
      # predates that fix - a rollback to an old tag is exactly when the box is
      # already full. Reporting free space makes the next failure legible
      # instead of arriving as `no space left on device` with no context.
      - name: Reclaim disk on the instance
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$HOST" '
            docker container prune -f >/dev/null 2>&1 || true
            docker image prune -af  >/dev/null 2>&1 || true
            df -h / | awk "NR==2 {print \$4 \" free of \" \$2 \" (\" \$5 \" used)\"}"
          '

      - name: Deploy
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/deploy.pem deploy.sh "$HOST:/tmp/till-deploy.sh"
          ssh -i ~/.ssh/deploy.pem "$HOST" \
            "IMAGE='${{ env.IMAGE }}' TAG='${{ github.sha }}' bash /tmp/till-deploy.sh"

      - name: Prove it came back up
        env:
          HOST: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          sleep 20
          # A deploy that reports success without checking is a deploy that
          # reports success while the container restart-loops.
          ssh -i ~/.ssh/deploy.pem "$HOST" \
            'docker ps --filter name=till-infinity --format "{{.Names}} {{.Status}}" | grep -q Up' \
            || { ssh -i ~/.ssh/deploy.pem "$HOST" 'docker logs --tail 40 till-infinity'; exit 1; }
