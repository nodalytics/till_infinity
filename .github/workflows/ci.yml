name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the deploy workflow, so nothing reaches the instance that has
  # not passed the same checks a pull request does.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # **The one exception to "no network in CI" below, and a deliberate one.**
    # Everything else runs against fakes, which is exactly how three bugs in
    # the Redis transport survived review and a green suite: a fake cannot
    # tell you that `XADD` stores `False` as the string "False", or that a new
    # consumer group replays the backlog. This is a container on the runner -
    # no internet, no credentials - and the tests that use it skip cleanly
    # where it is absent, which is why one of them fails if CI ever skips.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      # No network in CI: every test runs against fakes and temp SQLite files,
      # with one exception - the Redis service container above, which is local
      # to the runner. See the note on `services:`.
      - name: Tests
        env:
          TILL_TEST_REDIS_URL: redis://localhost:6379
          CI: "1"
        run: uv run pytest -q

# **The Go job is gone, and that is a retirement rather than a deletion.**
# ADR 0003 took on a second toolchain for the Go services under `services/`;
# `a80de7e5` retired those with the rest of the legacy desk, and the module now
# sits at `research/retire/services/ticks/`, which CI excludes on purpose.
#
# The job had its own guard - "no Go module under services/ - this job is
# pointing at nothing" - and that guard had been firing on every run since the
# retirement, so the checks list carried a red job that described nothing and
# gated every merge. The guard was right to be an error rather than a silent
# pass; what was missing was removing the job with the code it checked.
#
# Restoring it is one block if a Go service returns to `services/`: set up Go,
# then gofmt, vet, build and test every module found under there.
