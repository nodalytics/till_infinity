name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the deploy workflow, so nothing reaches the instance that has
  # not passed the same checks a pull request does.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      # No network in CI: every test runs against fakes and temp SQLite files.
      - name: Tests
        run: uv run pytest -q
