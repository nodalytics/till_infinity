name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the deploy workflow, so nothing reaches the instance that has
  # not passed the same checks a pull request does.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # **The one exception to "no network in CI" below, and a deliberate one.**
    # Everything else runs against fakes, which is exactly how three bugs in
    # the Redis transport survived review and a green suite: a fake cannot
    # tell you that `XADD` stores `False` as the string "False", or that a new
    # consumer group replays the backlog. This is a container on the runner -
    # no internet, no credentials - and the tests that use it skip cleanly
    # where it is absent, which is why one of them fails if CI ever skips.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      # No network in CI: every test runs against fakes and temp SQLite files,
      # with one exception - the Redis service container above, which is local
      # to the runner. See the note on `services:`.
      - name: Tests
        env:
          TILL_TEST_REDIS_URL: redis://localhost:6379
          CI: "1"
        run: uv run pytest -q

  # **A second toolchain, which ADR 0003 said this would cost.** Separate from
  # `check` rather than bolted onto it: the two have nothing to share, and a Go
  # compile failure should not read as a Python test failure in the checks list.
  #
  # One job for every Go service under `services/`, found rather than listed,
  # so adding the next one does not need this file edited - the mistake made
  # once already in `strategy.py`, where a new strategy had to be registered in
  # two places and the second was forgotten.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/*/go.sum

      - name: Vet, format and test every Go service
        run: |
          shopt -s nullglob
          found=0
          for mod in services/*/go.mod; do
            dir=$(dirname "$mod")
            found=1
            echo "::group::$dir"
            # `gofmt -l` prints the files it would change and exits 0, so the
            # check is that it printed nothing.
            unformatted=$(gofmt -l "$dir")
            if [ -n "$unformatted" ]; then
              echo "::error::gofmt would change: $unformatted"
              exit 1
            fi
            ( cd "$dir" && go vet ./... && go build ./... && go test ./... )
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            echo "::error::no Go module under services/ - this job is pointing at nothing"
            exit 1
          fi
