# The bus broker. One stream per topic, one consumer group per subscriber.
#
# `docker-compose.yml` passed `--appendonly yes` on the command line and
# nothing else. This file is where that decision and the ones below it live,
# because a broker is configuration with no code - which is the whole reason
# ADR 0002 gives it a directory under `services/` rather than a package.

# **Persistence, because collectors do not resend.** `Bus.publish` uses
# `try_send`, so a full channel drops the notice rather than stalling the
# collector that produced it. A dropped message is gone: nothing replays a bar
# that was never written. The append-only file is what makes a broker restart
# survivable rather than a silent gap in the record.
appendonly yes
appendfsync everysec

# **Bounded memory, and an eviction policy that refuses rather than guesses.**
# The desk's streams are trimmed by the client, but a subscriber that stops
# reading leaves its group's backlog growing. `noeviction` makes that a
# visible write error instead of Redis quietly discarding the oldest entries
# of whichever key it likes - which, for a bus, would mean losing messages
# with no record of which.
maxmemory 256mb
maxmemory-policy noeviction

# Only reachable on the compose network. No password here because there is no
# route to it from outside; if that changes, this is where `requirepass` goes
# and `TILL_REDIS_URL` grows credentials.
bind 0.0.0.0
protected-mode no

# Latency over throughput: this carries decisions, not bulk.
tcp-keepalive 60
timeout 0

# Keep the log quiet enough to read. A broker that logs every connection
# buries the one line that matters.
loglevel notice
